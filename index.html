<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXORA">
<meta name="theme-color" content="#000211">
<title>NEXORA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>#nx-launch{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#000211;transition:opacity .5s ease,transform .5s ease;-webkit-user-select:none;user-select:none}
#nx-launch.out{opacity:0;transform:scale(1.035);pointer-events:none}
.nxl-mark{position:relative;width:min(74vw,340px)}
.nxl-mark img{position:relative;display:block;width:100%;height:auto;animation:nxl-in 1s cubic-bezier(.2,.8,.2,1) both,nxl-float 5s ease-in-out 1.1s infinite}
.nxl-glow{position:absolute;left:50%;top:50%;width:135%;height:135%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(100,139,255,.32),rgba(146,123,255,.12) 55%,transparent 75%);animation:nxl-pulse 2.8s ease-in-out infinite}
.nxl-word{margin-top:22px;font-weight:700;font-size:24px;letter-spacing:.46em;padding-left:.46em;background:linear-gradient(180deg,#fff,#c9d4ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:nxl-up .8s .35s cubic-bezier(.2,.8,.2,1) both}
.nxl-tag{margin-top:10px;display:flex;align-items:center;gap:10px;color:#A7B0C2;font-size:13px;letter-spacing:.12em;font-style:italic;animation:nxl-up .8s .55s cubic-bezier(.2,.8,.2,1) both}
.nxl-tag:before,.nxl-tag:after{content:"";width:22px;height:1px;background:linear-gradient(90deg,transparent,#648BFF)}.nxl-tag:after{transform:scaleX(-1)}
.nxl-bar{position:absolute;bottom:calc(72px + env(safe-area-inset-bottom));width:132px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;animation:nxl-up .6s .7s both}
.nxl-bar i{position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:3px;background:linear-gradient(90deg,#648BFF,#927BFF);animation:nxl-load 1.15s ease-in-out infinite}
.nxl-msg{margin-top:28px;max-width:300px;text-align:center;color:#A7B0C2;font-size:14px;line-height:1.5}
.nxl-msg button{margin-top:14px;border:0;border-radius:12px;padding:11px 22px;font:600 15px inherit;font-family:inherit;color:#fff;background:linear-gradient(135deg,#648BFF,#927BFF);cursor:pointer}
@keyframes nxl-in{from{opacity:0;transform:scale(.8);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes nxl-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes nxl-pulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.94)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes nxl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes nxl-load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
.nx-cont .nxl-mark img{animation:nxl-float 5s ease-in-out infinite}.nx-cont .nxl-word,.nx-cont .nxl-tag,.nx-cont .nxl-bar{animation:none}
@media (prefers-reduced-motion:reduce){#nx-launch *{animation:none!important}}
</style>
</head>
<body style="margin:0;background:#000211">
<div id="nx-launch" role="status" aria-label="NEXORA is starting">
  <div class="nxl-mark"><div class="nxl-glow"></div><img src="icons/launch-logo.webp" alt="NEXORA — Your Mind. Amplified."></div>
  <div class="nxl-bar"><i></i></div>
</div>
<script>
/* Loader: runs the newest copy of the app — the one built into this install,
   or a newer one downloaded from GitHub by the in-app update button. */
window.SB_SHELL = { apk: '1.9.0' };
window.__nxLaunch = Date.now();
(function () {
  var ver = function (h) { return ((h || '').match(/APP_VERSION\s*=\s*'([\d.]+)'/) || [])[1] || '0'; };
  var newer = function (a, b) { a = String(a).split('.').map(Number); b = String(b).split('.').map(Number);
    for (var i = 0; i < 3; i++) { if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0); } return false; };
  var cached = function () { return new Promise(function (res) {
    try { var r = indexedDB.open('sb-updater', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { try { var q = r.result.transaction('kv').objectStore('kv').get('app'); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; } catch (e) { res(null); } };
      r.onerror = function () { res(null); };
    } catch (e) { res(null); } }); };
  var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if (!native && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  Promise.all([
    fetch('app.html', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }),
    location.search.indexOf('reset') >= 0 ? null : cached()
  ]).then(function (v) {
    var bundled = v[0], c = v[1], html = bundled;
    if (c && c.html && (!bundled || newer(c.version, ver(bundled)))) html = c.html;
    if (!html) { var b = document.querySelector('.nxl-bar'); if (b) b.remove(); document.getElementById('nx-launch').insertAdjacentHTML('beforeend', '<div class="nxl-msg">NEXORA could not start. Check your internet connection the first time you open it.<br><button onclick="location.reload()">Try again</button></div>'); return; }
    document.open(); document.write(html); document.close();
  });
})();
</script>
</body>
</html>
